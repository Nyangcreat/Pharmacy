<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출동! 기도폐쇄 구조 작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --bg:#FFF4EC; --paper:#FFFFFF; --ink:#33302E; --muted:#776C66; --line:#F0DCCD;
  --red:#E2533A; --red-d:#B93E29; --red-soft:#FFE3DA; --navy:#2F4A7A; --ok:#2E8B5A; --ok-bg:#E3F4EA;
  --bad:#B23A28; --bad-bg:#FDE6E0; --gold:#F2B33D; --sky:#DCEFFA;
  --fd:"Jua","Gowun Dodum",system-ui,sans-serif;
  --fb:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;word-break:keep-all;-webkit-tap-highlight-color:transparent}
#app{max-width:780px;margin:0 auto;padding:12px 14px 40px}
#game{display:flex;flex-direction:column;gap:10px}
.hero{background:var(--paper);border:2px solid var(--line);border-radius:28px;padding:clamp(20px,5vw,44px);display:grid;gap:22px;margin-top:8px}
.mission{display:flex;align-items:center;justify-content:center;gap:12px}
.chokeimg{width:clamp(76px,20vw,120px);height:auto;flex:0 0 auto;mix-blend-mode:multiply}
#gr,#cl,#no{text-align:center}
.hero h1{font-family:var(--fd);font-weight:400;margin:0;font-size:clamp(32px,8vw,50px);line-height:1.15;text-align:center;color:var(--red);text-wrap:balance}
.mission p{margin:0;font-size:clamp(14px,3.8vw,18px);line-height:1.75;text-align:center}
.mission b{color:var(--red)}
form.name{display:grid;gap:10px;width:100%;max-width:420px;margin:0 auto}
form.name>div{display:grid;gap:4px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.three>div{display:grid;gap:4px}
label.lbl{font-weight:700}
.nm-note{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
input.txt{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
form.name .btn{font-size:22px;min-height:54px;margin-top:4px}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:480px){.top .ttl{font-size:16px;flex-basis:100%}.chip{font-size:13px;padding:3px 10px}}
.top .ttl{font-family:var(--fd);font-size:18px;color:var(--red);margin-right:auto}
.chip{font-family:var(--fd);font-size:15px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.hrt b{color:#E0475E;font-weight:400}
#stage{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:400/260;border-radius:22px;overflow:hidden;border:1.5px solid var(--line);background:var(--sky)}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.qcard p.sub{margin:-4px 0 10px;font-size:17px;color:var(--ink)}
.ask.ctr{text-align:center}
.tagpill .thl{color:#C0392B;font-weight:400}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:72%;width:max-content;background:#fff;border-radius:14px;padding:6px 11px;font-size:14px;line-height:1.4;box-shadow:0 3px 10px rgba(60,30,20,.15);z-index:3;white-space:normal;text-align:center}
.bub small{display:block;font-size:11px;font-weight:700;color:var(--red)}
.bub::after{content:"";position:absolute;left:var(--tx,50%);bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.fx{position:absolute;z-index:4;pointer-events:none;font-family:var(--fd);font-size:22px;color:var(--red);text-shadow:0 2px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:pop 1.1s ease-out forwards;white-space:nowrap}
.fx.big{font-size:30px}
.fx.blue{color:#3A6FC4}
.fx.hrt{color:#E0475E}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
#sitbox.off{display:none!important}
.o2.inq{margin:0;padding:10px 14px 0}
.o2{padding:0 4px;margin:-2px 0;font-family:var(--fd);font-size:16px;display:flex;align-items:center;gap:10px}
.o2lab{color:#B7860B;white-space:nowrap}
.o2 .bar{flex:1;height:12px;border-radius:6px;background:#E5E1DE;overflow:hidden}
.o2 .bar i{display:block;height:100%;width:100%;background:#4BA3E3;border-radius:6px;transition:width .3s linear,background .3s}
.o2.low{animation:blink .8s infinite}
.o2 .warn{color:var(--red)}
@keyframes blink{50%{background:#FFE3DA}}
.ifcard{position:absolute;inset:12% 10%;z-index:5;background:#FFF9E6;border:3px dashed var(--gold);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font-family:var(--fd);font-size:20px;line-height:1.4}
.ifcard small{font-size:14px;color:var(--muted);font-family:var(--fb)}
.qcard{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
#panel{padding:10px 14px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.narr{font-size:15px;line-height:1.6;color:var(--ink)}
.stepno{font-family:var(--fd);font-size:13px;color:var(--red)}
.ask{font-family:var(--fd);font-size:19px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:16px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;color:var(--ink);cursor:pointer;line-height:1.4}
.opt:active{background:var(--red-soft)}
.opt[disabled]{opacity:.4;cursor:default;text-decoration:line-through}
.opt.right{border-color:var(--ok);background:var(--ok-bg);opacity:1;text-decoration:none}
.opt.sel{border-color:var(--navy);background:#E4ECF8}
.fb{font-size:14px;line-height:1.5;border-radius:12px;padding:8px 11px}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.sent{font-family:var(--fd);font-size:20px;line-height:1.9;margin:0}
.c0{--c:#5A9E7E;--cs:#E3F1E9}.c1{--c:#6E8DB5;--cs:#E7EEF6}.c2{--c:#B0905A;--cs:#F5EEDF}.c3{--c:#9283B0;--cs:#EEEBF4}
.sent .bl{display:inline-block;min-width:64px;text-align:center;border:2px dashed var(--c);margin:2px 3px;padding:0 10px;color:var(--c);background:var(--cs);border-radius:10px;line-height:1.6;vertical-align:baseline}
.sent .bl i,.grp .lab i{font-style:normal;margin-right:3px}
.sent .bl.fill{border-style:solid}
.chs{display:inline;line-height:1.9}
.glue{white-space:nowrap}
.tpa{opacity:.75}
.tps{margin:0 8px;opacity:.45}
.wbank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;background:#FFFBF5}
.chip{--c:#6E8DB5;--cs:#E7EEF6;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;padding:.25em .8em;cursor:grab}
.chip.used{opacity:.3}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.2);margin:0}
.sent .bl.drop{min-width:90px;cursor:pointer}
.sent .bl.drop.over{border-style:solid;box-shadow:0 0 0 3px var(--cs)}
.qrow{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.qrow .ask{margin:0}
.tagpill{flex:none;align-self:flex-start;white-space:nowrap;max-width:100%;background:#A8D98A;color:#2F5A1E;font-family:var(--fd);font-size:15px;line-height:1.5;border-radius:999px;padding:3px 14px}
.chs .sl{margin:0 2px;color:#C9BFB4}
.pick{font:inherit;font-family:var(--fd);font-size:1em;color:var(--ink);background:var(--cs);border:1.5px solid color-mix(in srgb,var(--c) 45%,#fff);border-radius:10px;padding:.08em .55em;margin:.12em 0;cursor:pointer;line-height:1.45;vertical-align:middle;box-shadow:0 1.5px 0 color-mix(in srgb,var(--c) 35%,#fff);transition:background .15s,color .15s}
.pick.sel{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 1.5px 0 color-mix(in srgb,var(--c) 70%,#000)}
.pick.x{opacity:.4;text-decoration:line-through}
.chs.bad .pick.sel{background:var(--bad);border-color:var(--bad)}
.sent input.inb{width:86px;text-align:center;border-radius:12px;font-family:var(--fd);min-width:0;font:inherit;font-size:20px;line-height:1.6;padding:0 6px;outline:none}
.sent input.inb::placeholder{color:#B9B1A8;opacity:1;font-size:14px}
.sent input.inb:focus{border-style:solid;box-shadow:0 0 0 3px var(--cs)}
.sent .bl.good{border-style:solid;color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.sent .bl.bad{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.tray{display:flex;flex-direction:column;gap:10px;border-top:1.5px dashed var(--line);padding-top:10px}
.grp{display:flex;flex-direction:column;gap:6px;margin:2px 0 8px}
.sentwrap{display:flex;flex-direction:column;gap:2px;position:relative}
.sentwrap .sent{font-size:var(--sent,18px)}
.lgap{height:8px}
.grp .lab{font-size:13px;color:var(--c);font-weight:700}
.grp .opts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.grp .opt{border:2px dashed var(--c);background:var(--cs);color:var(--c);border-radius:10px;text-align:center;font-family:var(--fd);font-size:17px}
.grp .opt.sel{border-style:solid;box-shadow:0 0 0 3px var(--cs);background:#fff}
.fbl{margin:0;padding-left:18px;display:grid;gap:2px}
.btn{font-family:var(--fd);font-size:19px;border:0;border-radius:16px;padding:10px 18px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--red-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--red);border:2px solid var(--red);box-shadow:0 3px 0 var(--red-soft)}
.btn.navy{background:var(--navy);box-shadow:0 4px 0 #1E3156}
.btn[disabled]{opacity:.5}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;min-height:42px;font-size:15px}
.slot b{font-family:var(--fd);font-weight:400;color:var(--red);width:20px}
.slot.on{border-style:solid;border-color:var(--navy);background:#F1F5FB}
.slot.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool .opt{padding:8px 11px;font-size:15px}
.cover{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(255,244,236,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:10px}
.card{background:#fff;border-radius:22px;padding:16px 18px;max-width:360px;width:100%;box-shadow:0 10px 30px rgba(80,40,20,.2);display:flex;flex-direction:column;gap:8px;text-align:center}
.card h1{font-family:var(--fd);font-weight:400;font-size:24px;margin:0;color:var(--red);line-height:1.25}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.card .row{display:flex;gap:6px}
.card input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
.hint2{font-size:13px;color:var(--bad);min-height:18px}
#certWrap{display:flex;flex-direction:column;gap:10px}
#certImg{width:auto;max-width:min(100%,560px);max-height:52vh;margin:0 auto;border-radius:16px;box-shadow:0 6px 20px rgba(80,40,20,.15);display:block}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow>*{flex:1 1 45%;text-align:center;text-decoration:none}
.msg{font-size:14px;color:var(--ok);min-height:20px;text-align:center}
.tip{font-size:13px;color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:18px;padding:14px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.modal img{width:100%;border-radius:10px}
/* svg character motion */
.kid{transition:transform .9s ease-in-out}
.kin,.up,.arm{transform-box:fill-box}
.kin{transform-origin:50% 100%}
.up{transform-origin:50% 100%;transition:transform .5s}
.arm{transform-origin:50% 6%;transition:transform .35s}
.k-bob .kin{animation:bob .5s ease-in-out infinite}
.k-shake .kin{animation:shake .18s linear infinite}
.k-jump .kin{animation:jump .45s ease-out 3}
.k-run .kin{animation:bob .25s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) scaleY(.97)}}
@keyframes shake{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes jump{40%{transform:translateY(-14px)}}
.tint{transition:opacity .5s}
.van{transition:transform 1.6s cubic-bezier(.2,.7,.3,1)}
.flash{animation:flash .5s steps(1) infinite}
@keyframes flash{50%{fill:#3A6FC4}}
.pick2{display:flex;gap:10px;margin-top:12px}
.pick2 .p2{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 10px;border-radius:14px;box-shadow:none;text-align:center;line-height:1.3}
.pick2 .p2 b{font-family:var(--fd);font-weight:400;font-size:20px}
.pick2 .p2 small{font-size:13px;opacity:.92}
.pick2 .again{background:#F2B33D;color:#4A3200}
.pick2 .submit{background:#3E8E5E;color:#fff}
.pick2 .submit.on{outline:3px solid #2B6A44;outline-offset:2px}
#submitBox{margin-top:12px}
#submitBox[hidden]{display:none}
.savebig{width:100%;font-size:20px;box-shadow:none;border-radius:14px}
.up-row{display:flex;gap:8px;margin-top:10px}
.up-row .btn.up span{display:block;white-space:nowrap;line-height:1.3}
.up-row .btn.up{flex:1 1 0;flex-direction:column;font-size:16px;padding:10px 6px;border-radius:12px;box-shadow:none;text-align:center;text-decoration:none;min-height:0}
.svguide{text-align:center;font-family:var(--fd);font-size:17px;color:#B23A28;margin:12px 0 8px}
.more{margin-top:0!important}
#svmsg:empty{display:none}
.sv-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sv-row .btn{flex:1 1 150px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:20px;box-shadow:none;border-radius:14px}
.up-col{flex:1 1 150px;display:grid;gap:6px}
.btn.up{background:#4A7FD8;color:#fff}
.sv-row .btn.up.sm{font-size:16px;padding:9px 10px;min-height:0}
.btn.more{align-self:flex-start;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none;margin-top:8px;padding:14px 26px}
.testbtn{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
.testbar{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(40,36,34,.9);color:#fff;border-radius:18px;padding:6px 8px;max-width:calc(100% - 16px);font-family:var(--fd);font-size:14px}
.testbar button{font:inherit;border:0;border-radius:12px;background:#fff;color:#333;padding:8px 12px;cursor:pointer;min-width:42px}
.testbar button[disabled]{opacity:.45}
.testbar .tbm{display:flex;gap:4px}
.testbar .tbm button{background:#5A524D;color:#fff;padding:6px 9px;font-size:13px}
#tbLab{min-width:70px;text-align:center}
body.testing #app{padding-bottom:110px}
.stagehrt{position:absolute;right:10px;top:10px;z-index:3;background:rgba(255,255,255,.94)}
.spill{display:inline-block;background:#A8D98A;color:#2F5A1E;font-family:var(--fd);font-size:15px;line-height:1.5;font-weight:400;border-radius:999px;padding:3px 14px;margin-right:8px;vertical-align:2px}
.gpill{display:inline-block;background:var(--red);color:#fff;font-size:15px;border-radius:999px;padding:2px 12px;margin-right:8px;vertical-align:2px}
.mtl{margin:0;font-family:var(--fd);font-size:18px;color:var(--red)}
.sit{font-family:var(--fd);font-size:20px;line-height:1.2;color:var(--ink);display:flex;align-items:center;gap:3px;padding:2px 2px 0;margin-bottom:-4px}
.sit svg{width:34px;height:26px;flex:none;margin-top:-2px}
.sitbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px 14px;font-family:var(--fd);font-size:18px;line-height:1.45;color:var(--ink)}
#panel p{margin:0}
.backbox{background:#FFF8EE;border:1.5px solid var(--line);border-radius:16px;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.backbox svg{display:block;width:100%;max-width:360px;margin:0 auto;height:auto;cursor:pointer}
.upar{animation:upar 1.1s ease-in-out infinite}
@keyframes upar{0%{transform:translateY(8px);opacity:.3}60%{transform:translateY(-6px);opacity:1}100%{transform:translateY(-10px);opacity:0}}
.bkpop{font-family:var(--fd);font-size:26px;fill:var(--red);paint-order:stroke;stroke:#fff;stroke-width:5px;animation:bkpop .8s ease-out forwards}
@keyframes bkpop{to{transform:translateY(-30px);opacity:0}}
#bkBody{transform-box:fill-box;transform-origin:50% 100%}
#bkBody.jolt{animation:jolt .25s ease-out}
@keyframes jolt{40%{transform:translateY(-6px)}}
.swcount{text-align:center;font-family:var(--fd);font-size:24px;color:var(--red)}
.fb.tipb{background:#FFF6DC;color:#7A5A12}
#panel .ask+.sentwrap,#panel .tagpill+.sentwrap{margin-top:-2px}
@media (prefers-reduced-motion:reduce){.k-bob .kin,.k-shake .kin,.k-run .kin,.o2.low,.flash{animation:none}}
</style>
</head>
<body>
<div id="app">

<script>
(()=>{
const $=id=>document.getElementById(id);
const SVGNS="http://www.w3.org/2000/svg";
const sv=$("sv"),stage=$("stage"),panel=$("panel");
const BOARDS=[['5-3','https://b.tkbell.co.kr/tkboard/woi/1345520/82E25xF841.do?pageSeq=2703342'],['5-1','https://b.tkbell.co.kr/tkboard/woi/1345520/82E25xF841.do?pageSeq=2703339'],['5-2','https://b.tkbell.co.kr/tkboard/woi/1345520/82E25xF841.do?pageSeq=2703341']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let FAST=false,TEST=false,BUSY=false;
const wait=ms=>FAST?Promise.resolve():new Promise(r=>setTimeout(r,ms));

/* ---------- sound ---------- */
let AC=null;
function tone(f,d,type="sine",v=.1,dl=0){if(!AC||FAST)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
const sfx={good:()=>{tone(784,.2,"triangle");tone(988,.2,"triangle",.1,.09);tone(1319,.4,"triangle",.1,.18)},bad:()=>{tone(330,.2,"square",.05);tone(262,.3,"square",.05,.15)},tap:()=>tone(520,.08,"triangle",.08),siren:()=>{for(let i=0;i<4;i++){tone(880,.25,"sine",.06,i*.5);tone(660,.25,"sine",.06,i*.5+.25)}}};

/* ---------- svg helpers ---------- */
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const MOUTH={smile:"M-7,-92 Q0,-85 7,-92",open:"M-4,-92 a4,4.5 0 1,0 8,0 a4,4.5 0 1,0 -8,0",worry:"M-7,-88 Q0,-94 7,-88",flat:"M-6,-90 L6,-90",oo:"M-3,-91 a3,3 0 1,0 6,0 a3,3 0 1,0 -6,0"};
const POSES={blowUp:[8,-155,0],blowHit:[8,-74,0],idle:[8,-8,0],choke:[-118,118,0],cough:[8,124,0],phone:[8,-172,0],happy:[150,-150,0],point:[8,-70,0],pointL:[70,-8,0],eat:[8,138,0],surprise:[125,-125,0],bend:[30,-30,24],hug:[-60,60,0],fist:[-62,62,0],lean:[-35,35,30]};
function makeKid(o){
  // o: x, y, s, skin, hair, style, shirt, pants, cap, uniform, flip
  const root=el("g",{class:"kid"},o.layer||sv);
  const kin=el("g",{class:"kin"},root);
  el("ellipse",{cx:0,cy:1,rx:22,ry:4,fill:"rgba(0,0,0,.12)"},kin);
  const pants=o.pants||"#4E6A9A";
  if(o.skirt){el("path",{d:"M-20,-40 L20,-40 L24,-22 L-24,-22 Z",fill:pants},kin);
    for(const x of [-9,9]){el("rect",{x:x-4,y:-24,width:8,height:22,rx:4,fill:o.skin||"#F6D2BC"},kin)}}
  else for(const x of [-8,8])el("rect",{x:x-6,y:-42,width:12,height:40,rx:5,fill:pants},kin);
  for(const x of [-9,9])el("ellipse",{cx:x,cy:-2,rx:8,ry:4,fill:o.shoe||"#FFFFFF",stroke:"#D9D2CC","stroke-width":1},kin);
  const up=el("g",{class:"up"},kin);
  const shirt=o.shirt||"#F28C6B";
  el("rect",{x:-21,y:-84,width:42,height:48,rx:15,fill:shirt},up);
  if(o.uniform){el("rect",{x:-21,y:-58,width:42,height:5,fill:"#F4F1C2"},up);el("rect",{x:-21,y:-48,width:42,height:5,fill:"#F4F1C2"},up)}
  if(o.stripe){for(const y of [-74,-62,-50])el("rect",{x:-21,y,width:42,height:5,fill:o.stripe},up)}
  const arms=[];
  for(const s of [-1,1]){const g=el("g",{class:"arm"},up);el("rect",{x:s*24-5,y:-80,width:10,height:34,rx:5,fill:o.sleeve||shirt},g);el("circle",{cx:s*24,cy:-45,r:6.5,fill:o.skin||"#F6D2BC"},g);arms.push(g)}
  const phone=el("rect",{x:20,y:-54,width:8,height:13,rx:2,fill:"#2B2B33",opacity:0},arms[1]);
  const head=el("g",{class:"head"},up);
  el("rect",{x:-6,y:-90,width:12,height:8,fill:o.skin||"#F6D2BC"},head);
  if(o.style==="long")el("path",{d:"M-26,-104 C-28,-80 -22,-74 -16,-74 L16,-74 C22,-74 28,-80 26,-104 Z",fill:o.hair},head);
  el("circle",{cx:0,cy:-104,r:24,fill:o.skin||"#F6D2BC"},head);
  const tint=el("circle",{cx:0,cy:-104,r:24,fill:"#6E8FD6",opacity:0,class:"tint"},head);
  const hair=o.hair||"#3E2A20";
  if(o.cap){el("path",{d:"M-25,-108 C-25,-136 25,-136 25,-108 Z",fill:o.cap},head);el("rect",{x:-4,y:-126,width:8,height:8,rx:2,fill:"#F2B33D"},head);el("path",{d:"M-6,-108 L32,-108 L30,-104 L-6,-104 Z",fill:o.cap},head)}
  else{el("path",{d:"M-27.5,-101 A27.5,27.5 0 0,1 27.5,-101 C22,-112 4,-118 -12,-110 C-18,-107 -23,-104 -27.5,-101 Z",fill:hair},head);
    if(o.style==="pig")for(const s of [-1,1])el("circle",{cx:s*27,cy:-112,r:9,fill:hair},head);
    if(o.style==="bun")el("circle",{cx:0,cy:-131,r:9,fill:hair},head)}
  const eyes=[];for(const s of [-1,1])eyes.push(el("ellipse",{cx:s*8.5,cy:-102,rx:2.8,ry:3.6,fill:"#2A2224"},head));
  for(const s of [-1,1])el("ellipse",{cx:s*15,cy:-94,rx:4.5,ry:2.6,fill:"#F4A3A8",opacity:.8},head);
  const mouth=el("path",{d:MOUTH.smile,fill:"none",stroke:"#8A3B3B","stroke-width":2.2,"stroke-linecap":"round"},head);
  const k={root,kin,up,arms,tint,mouth,eyes,phone,x:o.x,y:o.y||232,s:o.s||1,rot:0,flip:o.flip?-1:1};
  place(k);pose(k,"idle");return k;
}
function place(k){k.root.setAttribute("transform",`translate(${k.x},${k.y}) rotate(${k.rot}) scale(${k.s*k.flip},${k.s})`);k.root.style.transform="";}
function moveTo(k,x,ms=900){if(FAST){k.x=x;place(k);return Promise.resolve()}return new Promise(r=>{const x0=k.x,t0=performance.now();k.root.classList.add("k-run");function f(t){const u=Math.min(1,(t-t0)/ms);k.x=x0+(x-x0)*(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);place(k);if(u<1)requestAnimationFrame(f);else{k.root.classList.remove("k-run");r()}}requestAnimationFrame(f)})}
function pose(k,name,mouth){const p=POSES[name]||POSES.idle;k.arms[0].style.transform=`rotate(${p[0]}deg)`;k.arms[1].style.transform=`rotate(${p[1]}deg)`;k.up.style.transform=`rotate(${p[2]}deg)`;k.phone.setAttribute("opacity",name==="phone"?1:0);if(mouth)k.mouth.setAttribute("d",MOUTH[mouth])}

    const body=lines.map(l=>l.h?`<p class="sent">${l.h}</p>`:`<div class="lgap"></div>`).join("");

    {const f=()=>{const w=panel.querySelector(".sentwrap");if(!w)return;let v=sentSize(w);w.style.setProperty("--sent",v+"px");const ps=[...w.querySelectorAll("p.sent")];ps.forEach(q=>q.style.whiteSpace="nowrap");const mn=w.clientWidth>480?15:13;const cw=q=>{const r=document.createRange();r.selectNodeContents(q);return r.getBoundingClientRect().width};while(v>mn&&ps.some(q=>cw(q)>q.clientWidth-6)){v-=.5;w.style.setProperty("--sent",v+"px")}ps.forEach(q=>q.style.whiteSpace="")};f();document.fonts&&document.fonts.ready.then(f)}

function viewBank(st){
  const blanks=st.parts.filter(p=>typeof p!=="string");blanks.forEach(b=>{b.val=null;b.state=""});
  const pool=shuffle(st.bank);let msg="",drag=null;
  function paint(){
    let k=0;const sent=st.parts.map(p=>{if(typeof p==="string")return esc(p);const j=k++,b=blanks[j];
      return `<span class="bl drop c${j%4} ${b.state==="good"?"good":b.state==="bad"?"bad":(b.val?"fill":"")}" data-j="${j}">${b.val?esc(b.val):"?"}</span>`}).join("");
    const used=blanks.map(b=>b.val).filter(Boolean);
    panel.innerHTML=`${tagHtml(st)}${st.q?`<p class="ask${st.qc?" ctr":""}">${esc(st.q)}</p>`:""}<div class="sentwrap"><p class="sent">${sent}</p></div>
      <p class="tip" style="text-align:left;margin:6px 0 4px">보기를 끌어서 빈칸에 놓거나, 눌러서 채워요. 채운 빈칸을 누르면 다시 빠져요.</p><div class="wbank">${pool.map(o=>`<button class="pick chip ${used.includes(o)?"used":""}" type="button" data-v="${esc(o)}" ${used.includes(o)?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      <button class="btn" id="chk" type="button" ${blanks.every(b=>b.val)?"":"disabled"}>확인</button><div id="fb">${msg}</div>`;
    const put=(j,v)=>{blanks.forEach(b=>{if(b.val===v&&b.state!=="good")b.val=null});const b=blanks[j];if(b.state==="good")return;b.val=v;b.state="";sfx.tap();paint()};
    panel.querySelectorAll(".drop").forEach(d=>d.onclick=()=>{const b=blanks[+d.dataset.j];if(b.state==="good"||!b.val)return;b.val=null;b.state="";paint()});
    panel.querySelectorAll(".chip:not(.used)").forEach(c=>{
      c.addEventListener("pointerdown",e=>{e.preventDefault();const r=c.getBoundingClientRect();drag={v:c.dataset.v,el:c,ghost:null,sx:e.clientX,sy:e.clientY,moved:false,ox:e.clientX-r.left,oy:e.clientY-r.top};try{c.setPointerCapture(e.pointerId)}catch(_){}});
      c.addEventListener("pointermove",e=>{if(!drag||drag.el!==c)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
        if(!drag.ghost){drag.moved=true;const g=c.cloneNode(true);g.className="pick chip ghost";document.body.appendChild(g);drag.ghost=g;c.classList.add("dragging")}
        drag.ghost.style.left=(e.clientX-drag.ox)+"px";drag.ghost.style.top=(e.clientY-drag.oy)+"px";
        panel.querySelectorAll(".drop").forEach(d=>{const r=d.getBoundingClientRect();d.classList.toggle("over",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})});
      const end=e=>{if(!drag||drag.el!==c)return;const dd=drag;drag=null;if(dd.ghost)dd.ghost.remove();c.classList.remove("dragging");
        if(!dd.moved){const j=blanks.findIndex(b=>!b.val&&b.state!=="good");if(j>=0)put(j,dd.v);return}
        const tgt=[...panel.querySelectorAll(".drop")].find(d=>{const r=d.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
        if(tgt)put(+tgt.dataset.j,dd.v);else paint()};
      c.addEventListener("pointerup",end);c.addEventListener("pointercancel",e=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;paint()});
    });
    $("chk").onclick=()=>{
      const wrong=blanks.filter(b=>b.state!=="good"&&b.val!==b.a);blanks.forEach(b=>{if(b.val===b.a)b.state="good"});
      if(!wrong.length){sfx.good();msg=`<div class="fb ok">${esc(st.ok||"맞아요! 명치와 배꼽 사이예요.")}</div>`;paint();panel.querySelectorAll("button").forEach(x=>x.disabled=true);setTimeout(()=>next(st),900);return}
      wrong.forEach(()=>lose());wrong.forEach(b=>{b.state="";b.val=null});
      msg=`<div class="fb no"><ul class="fbl">${[...new Set(wrong.map(b=>b.h))].map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`;paint();
    };
  }
  paint();
}
function viewOrder(st){
  const pool=shuffle(st.items.map((t,i)=>({t,i})));let picked=[],bad=new Set();
  function paint(){
    panel.innerHTML=`${tagHtml(st)}${head(st)}<p class="ask">${esc(st.q)}</p>
    <div class="slots">${st.items.map((_,j)=>{const p=picked[j];return `<div class="slot ${p?"on":""} ${bad.has(j)?"wrong":""}"><b>${j+1}</b><span>${p?esc(p.t):""}</span></div>`}).join("")}</div>
    <div class="pool">${pool.filter(p=>!picked.includes(p)).map(p=>`<button class="opt" type="button" data-i="${p.i}">${esc(p.t)}</button>`).join("")}</div>
    <div class="brow"><button class="btn ghost" id="undo" type="button" ${picked.length?"":"disabled"}>하나 빼기</button><button class="btn" id="chk" type="button" ${picked.length===st.items.length?"":"disabled"}>보고서 확인</button></div><div id="fb"></div>`;
    panel.querySelectorAll(".pool .opt").forEach(b=>b.onclick=()=>{sfx.tap();picked.push(pool.find(p=>p.i==b.dataset.i));bad.clear();paint()});
    $("undo").onclick=()=>{picked.pop();bad.clear();paint()};
    $("chk").onclick=()=>{
      const wrong=picked.map((p,j)=>p.i===j?-1:j).filter(j=>j>=0);
      if(!wrong.length){sfx.good();$("fb").innerHTML=`<div class="fb ok">출동 보고서 완성! 순서가 모두 맞아요.</div>`;panel.querySelectorAll("button").forEach(b=>b.disabled=true);setTimeout(()=>next(st),900)}
      else{lose();
        // keep the correct beginning, drop the rest so the child places them again
        const firstBad=Math.min(...wrong);picked=picked.slice(0,firstBad);bad=new Set([firstBad]);paint();$("fb").innerHTML=`<div class="fb no">${firstBad+1}번째부터 순서가 달라요. 다시 놓아 보세요.</div>`}
    };
  }
  paint();
}

  const items=st.items.map((o,i)=>({t:o[0],ok:!!o[1],h:o[2],i}));const got=new Set(),off=new Set();const need=items.filter(x=>x.ok).length;

      else{lose();off.add(o.i);paint(`<div class="fb no">${esc(o.h)}</div>`)}});
  }

}

/* ---------- certificate (drawn on a canvas so it saves as one picture) ---------- */
const who=()=>TEST?"선생님 미리보기":`${S.grade}학년 ${S.cls}반 ${S.no}번 ${S.name}`;
async function drawCert(){
  try{await Promise.all([document.fonts.load('40px "Jua"'),document.fonts.load('20px "Gowun Dodum"')])}catch(e){}
  const W=1000,H=620,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const FD='"Jua","Gowun Dodum",sans-serif',FB='"Gowun Dodum","Jua",sans-serif';
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  g.fillStyle="#FFF4EC";g.fillRect(0,0,W,H);
  rr(14,14,W-28,H-28,34);g.fillStyle="#FFFFFF";g.fill();g.lineWidth=10;g.strokeStyle="#E2533A";g.stroke();
  g.save();rr(14,14,W-28,140,34);g.clip();g.fillStyle="#E2533A";g.fillRect(14,14,W-28,140);g.restore();
  g.fillStyle="#fff";g.font=`56px ${FD}`;g.textAlign="center";g.fillText("명예 119 대원증",W/2,106);
  
  const r=rank(),n=Object.keys(S.res).length,x0=340;
  const star=(cx,cy,R0)=>{g.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5,b=a+Math.PI/5;g.lineTo(cx+Math.cos(a)*R0,cy+Math.sin(a)*R0);g.lineTo(cx+Math.cos(b)*R0*.45,cy+Math.sin(b)*R0*.45)}g.closePath();g.fillStyle="#F2B33D";g.fill();g.lineWidth=3;g.strokeStyle="#C98A12";g.stroke()};
  // avatar differs by rank
  const ax=180,ay=300;
  g.fillStyle=["#FFE3DA","#FFE9C7","#FFF1C2"][r.s-1];g.beginPath();g.arc(ax,ay,118,0,Math.PI*2);g.fill();
  if(r.s===3){g.strokeStyle="#E2B23B";g.lineWidth=6;g.stroke()}
  // body / uniform
  if(r.s===1){g.fillStyle="#F27A2E";rr(ax-70,ay+86,140,36,16);g.fill()}
  else if(r.s===2){g.fillStyle="#F27A2E";rr(ax-80,ay+80,160,40,18);g.fill();g.fillStyle="#F6E36B";g.fillRect(ax-80,ay+96,160,8)}
  else{g.fillStyle="#22365E";rr(ax-82,ay+80,164,40,18);g.fill();g.fillStyle="#E2B23B";rr(ax-86,ay+80,34,12,6);g.fill();rr(ax+52,ay+80,34,12,6);g.fill();
    g.beginPath();g.arc(ax,ay+102,12,0,Math.PI*2);g.fillStyle="#F2B33D";g.fill();g.strokeStyle="#C98A12";g.lineWidth=3;g.stroke()}
  // face
  g.fillStyle="#F6D2BC";g.beginPath();g.arc(ax,ay+10,72,0,Math.PI*2);g.fill();
  g.fillStyle="#2A2224";for(const s of [-1,1]){g.beginPath();g.ellipse(ax+s*24,ay+14,7,9,0,0,Math.PI*2);g.fill()}
  g.fillStyle="#F4A3A8";for(const s of [-1,1]){g.beginPath();g.ellipse(ax+s*44,ay+36,12,7,0,0,Math.PI*2);g.fill()}
  g.strokeStyle="#8A3B3B";g.lineWidth=5;g.lineCap="round";g.beginPath();g.moveTo(ax-18,ay+40);g.quadraticCurveTo(ax,ay+(r.s===3?60:56),ax+18,ay+40);g.stroke();
  // headwear
  if(r.s===1){g.fillStyle="#22365E";g.beginPath();g.ellipse(ax,ay-38,78,46,0,Math.PI,0);g.fill();g.fillRect(ax-78,ay-42,170,14);star(ax,ay-62,12)}
  else if(r.s===2){g.fillStyle="#F27A2E";g.beginPath();g.ellipse(ax,ay-30,84,62,0,Math.PI,0);g.fill();g.fillRect(ax-92,ay-36,184,14);
    g.fillStyle="#fff";rr(ax-34,ay-78,68,26,8);g.fill();g.fillStyle="#E2533A";g.font=`22px ${FD}`;g.textAlign="center";g.fillText("119",ax,ay-58)}
  else{ // red fire helmet with yellow front shield
    g.lineJoin="round";g.lineWidth=4;g.strokeStyle="#7A2A22";
    g.fillStyle="#D9483B";g.beginPath();g.ellipse(ax,ay-20,112,26,0,0,Math.PI*2);g.fill();g.stroke();
    g.beginPath();g.ellipse(ax,ay-34,80,74,0,Math.PI,0);g.closePath();g.fillStyle="#E2533A";g.fill();g.stroke();
    g.strokeStyle="#B83A2E";g.lineWidth=4;for(const dx of [-40,40]){g.beginPath();g.moveTo(ax+dx*0.2,ay-104);g.quadraticCurveTo(ax+dx,ay-90,ax+dx*1.4,ay-38);g.stroke()}
    g.fillStyle="#FFFFFF";g.globalAlpha=.55;g.beginPath();g.ellipse(ax+46,ay-80,7,16,.5,0,Math.PI*2);g.fill();g.globalAlpha=1;
    g.fillStyle="#F6D24B";g.strokeStyle="#7A5A12";g.lineWidth=4;g.beginPath();
    g.moveTo(ax,ay-128);g.lineTo(ax+26,ay-112);g.lineTo(ax+26,ay-60);g.lineTo(ax,ay-46);g.lineTo(ax-26,ay-60);g.lineTo(ax-26,ay-112);g.closePath();g.fill();g.stroke();
    g.beginPath();g.arc(ax,ay-88,13,0,Math.PI*2);g.lineWidth=4;g.stroke()}
  // under avatar: class info + name
  g.textAlign="center";g.fillStyle="#33302E";
  const cls=TEST?"선생님 미리보기":`${S.grade}학년 ${S.cls}반 ${S.no}번`;
  g.font=`40px ${FD}`;g.fillText(cls,ax,ay+172);if(!TEST){g.font=`800 48px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif`;g.fillText(S.name,ax,ay+230)}
  // rank row: big gold stars + big rank + (출동 횟수)
  g.textAlign="left";
  const maxW=W-44-x0;let fs=64,sr=26;
  const cnt=`(출동 횟수 : ${n}/3)`;
  for(;fs>34;fs-=2){sr=fs*.42;g.font=`${fs}px ${FD}`;const tw=g.measureText(r.t).width;g.font=`37px ${FD}`;const cw=g.measureText(cnt).width;if(r.s*sr*2.2+6+tw+10+cw<=maxW)break}
  const ry=226;for(let i=0;i<r.s;i++)star(x0+sr+i*sr*2.2,ry-fs*.33,sr);
  let sx=x0+r.s*sr*2.2+6;g.fillStyle="#33302E";g.font=`${fs}px ${FD}`;g.fillText(r.t,sx,ry);sx+=g.measureText(r.t).width+12;
  g.fillStyle="#5E5650";g.font=`37px ${FD}`;g.fillText(cnt,sx,ry-2);
  // per-situation hearts
  const heart=(cx,cy,R0,on)=>{g.beginPath();g.moveTo(cx,cy+R0*.9);g.bezierCurveTo(cx-R0*1.3,cy,cx-R0*.9,cy-R0*1.1,cx,cy-R0*.35);g.bezierCurveTo(cx+R0*.9,cy-R0*1.1,cx+R0*1.3,cy,cx,cy+R0*.9);g.closePath();g.fillStyle=on?"#E0475E":"#EFE6E2";g.fill()};
  g.fillStyle="#9A8F86";g.font=`28px ${FD}`;g.textAlign="center";const mid=(x0+W-60)/2;g.fillText("해결 기록",mid,298);const hw=g.measureText("해결 기록").width;g.strokeStyle="#D8CEC4";g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.moveTo(x0,287);g.lineTo(mid-hw/2-14,287);g.moveTo(mid+hw/2+14,287);g.lineTo(W-60,287);g.stroke();g.setLineDash([]);g.textAlign="left";
  let yy=366;
  ["main","alone","patrol"].forEach((k,i)=>{const rs=S.res[k];if(!rs)return;g.fillStyle="#33302E";g.font=`44px ${FD}`;const lab=`상황${i+1} 해결 점수`;g.fillText(lab,x0,yy);const lw=g.measureText(lab).width;
    g.fillText(" : ",x0+lw,yy);const cw=g.measureText(" : ").width;g.fillStyle="#E0475E";g.fillText(`♥ ${rs.hearts}`,x0+lw+cw,yy);yy+=60});
  const d=new Date(),p2=v=>String(v).padStart(2,"0");g.fillStyle="#4A433E";g.font=`38px ${FD}`;g.textAlign="center";g.fillText(`발급일: ${d.getFullYear()}. ${p2(d.getMonth()+1)}. ${p2(d.getDate())}.`,W/2,H-36);
  return c.toDataURL("image/png");
}
let certURL="";
async function showCert(){
  hushAll();
  const left=ORDER.filter(k=>!S.res[k]);
  panel.innerHTML=`<p class="ask" style="text-align:center">${S.cur==="main"?"출동 보고서 완성! 대원증이 발급됐어요.":(!left.length?"미션 완료! 최고 단계로 진급했어요.":perfectCount()>(S.lastPC||0)?"미션 완료! 한 단계 진급했어요.":"미션 완료! 대원증에 기록됐어요.")}</p>
   <div id="certWrap"><img id="certImg" alt="명예 119 대원증"></div>
   <div class="pick2">${left.length?`<button class="btn p2 again" type="button" data-m="${left[0]}"><b>한 번 더!</b><small>진급할 수 있어요 / 도장 +1</small></button>`:""}<button class="btn p2 submit" type="button" id="goSubmit"><b>이걸로 제출할래요</b><small>대원증 이미지를 저장 후 우리반 띵커벨 보드에 올려요</small></button></div>
   <div id="submitBox" ${left.length?'hidden':''}>
    <button class="btn savebig" id="saveImg" type="button">💾 저장하기</button>
    <p class="msg" id="svmsg" role="status" style="margin:6px 0 0;min-height:0"></p>
    <div class="up-row">${BOARDS.map(([c,u])=>`<a class="btn up sm" href="${u}" target="_blank" rel="noopener"><span>🔔 ${c}</span><span>띵커벨</span></a>`).join("")}</div>
   </div>`;
  S.lastPC=perfectCount();
  certURL=await drawCert();$("certImg").src=certURL;
  $("saveImg").onclick=saveImage;getDl();
  $("goSubmit").onclick=()=>{const bx=$("submitBox");bx.hidden=false;$("goSubmit").classList.add("on");bx.scrollIntoView({behavior:"smooth",block:"center"})};
  panel.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{stage.scrollIntoView({behavior:"smooth",block:"start"});startMission(b.dataset.m)});
  if(S.cur==="main"&&K.me){pose(K.me,"happy","smile");motion(K.me,"k-jump");if(K.r)say(K.r,"119 구급대원","명예 119 대원증을 드립니다!")}
  closeStage();
}
function closeStage(){
  const st=stage;if(st.hidden)return;sit("");
  setTimeout(()=>{if(st.hidden)return;const h=st.offsetHeight;st.style.overflow="hidden";
    const an=st.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0,marginBottom:"-10px"}],{duration:FAST?0:500,easing:"ease-in"});
    an.onfinish=()=>{st.hidden=true;try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){window.scrollTo(0,0)}};},FAST?0:1200);
}
function openStage(){stage.hidden=false}
let dlApi;
function getDl(){return dlApi||=(window.claude&&claude.use?claude.use("downloads").catch(()=>null):Promise.resolve(null))}
function dataBlob(url){const [h,b]=url.split(","),bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:"image/png"})}
async function saveImage(e){
  const b=e.currentTarget,t=b.textContent;b.disabled=true;b.textContent="만드는 중…";$("svmsg").textContent="";
  try{const url=certURL||await drawCert(),blob=dataBlob(url),name=`명예119대원증_${who().replace(/\s/g,"")}.png`;
    const touch=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>1;let done=false;
    // tablets/phones: share sheet first ("이미지 저장" / "사진에 저장")
    if(touch){try{const f=new File([blob],name,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});done=true;$("svmsg").textContent="저장했어요! 띵커벨 보드에 올려 보세요."}}catch(err){if(err&&err.name==="AbortError"){done=true;$("svmsg").textContent="저장을 취소했어요."}}}
    if(!done){const api=await getDl();if(api){b.textContent="저장 창을 확인하세요";try{await api.save({filename:name,data:blob});done=true;$("svmsg").textContent="저장했어요! 띵커벨 보드에 올려 보세요."}catch(err){if(err&&err.code==="declined"){done=true;$("svmsg").textContent="저장을 취소했어요."}}}}
    if(!done){try{const f=new File([blob],name,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});done=true}}catch(err){if(err&&err.name==="AbortError")done=true}}
    // tablets always get the long-press view too, in case the save went nowhere
    if(!done||touch)showSaved(url);
  }catch(err){$("svmsg").textContent="그림을 만들지 못했어요. 화면을 캡처해서 저장해 주세요."}
  b.disabled=false;b.textContent=t;
}
function showSaved(url){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box"><p class="ask">저장이 안 됐다면, <b>이 화면을 캡처해서 올려요</b><br><span style="font-size:.8em;color:var(--muted)">(태블릿 옆면 버튼 2개를 동시에 꾸욱~!)</span></p><img src="${url}" alt="명예 119 대원증"><button class="btn" type="button" data-x>닫기</button></div>`;d.onclick=ev=>{if(ev.target===d||ev.target.closest("[data-x]"))d.remove()};document.body.appendChild(d)}

/* ---------- teacher preview: skip steps without answering ---------- */
const NAMES={main:"필수",alone:"혼자",patrol:"순찰"};
function testBar(){
  if(!TEST)return;let bar=$("testBar");
  if(!bar){bar=document.createElement("div");bar.id="testBar";bar.className="testbar";document.body.appendChild(bar);
    bar.innerHTML=`<button type="button" data-a="prev" aria-label="이전 단계">◀</button><span id="tbLab"></span><button type="button" data-a="next" aria-label="다음 단계">▶</button><span class="tbm">${ORDER.map(k=>`<button type="button" data-m="${k}">${NAMES[k]}</button>`).join("")}<button type="button" data-a="cert">대원증</button></span>`;
    bar.onclick=e=>{const b=e.target.closest("button");if(!b||BUSY)return;if(b.dataset.m)jumpTo(b.dataset.m,0);else if(b.dataset.a==="prev")jumpTo(S.cur,Math.max(0,S.step-1));else if(b.dataset.a==="next")testNext();else if(b.dataset.a==="cert"){o2stop();if(!S.res.main)S.res.main={hearts:S.hearts,wrong:S.wrong};if(!S.feel)S.feel=["🙂","조금 떨리지만 할 수 있어요"];updCnt();showCert()}}}
  const n=S.cur?M[S.cur].steps.length:0;$("tbLab").textContent=S.cur?`${NAMES[S.cur]} ${Math.min(S.step+1,n)}/${n}`:"";
  bar.querySelectorAll("button").forEach(b=>b.disabled=BUSY);
}
async function testNext(){
  const st=M[S.cur].steps[S.step];if(!st)return;BUSY=true;testBar();hushAll();
  FAST=true;try{if(st.t==="narr"&&st.go)await st.go();else if(st.after)await st.after()}finally{FAST=false}hushAll();stage.querySelectorAll(".fx").forEach(e=>e.remove());
  if(st.t==="feel"&&!S.feel)S.feel=["🙂","조금 떨리지만 할 수 있어요"];
  S.step++;runStep();
}
async function jumpTo(key,target){
  openStage();
  BUSY=true;testBar();S.cur=key;mhead(M[key].head);S.hearts=10;S.wrong=0;setHearts();
  FAST=true;M[key].scene();const steps=M[key].steps;
  for(let i=0;i<target;i++){const st=steps[i];if(st.enter)await st.enter();if(st.t==="narr"&&st.go)await st.go();if(st.after)await st.after()}
  FAST=false;hushAll();stage.querySelectorAll(".fx").forEach(e=>e.remove());S.step=target;runStep();
}

/* ---------- start ---------- */
sceneStore();
$("startForm").addEventListener("submit",e=>{
  e.preventDefault();const gr=$("gr").value.trim(),cl=$("cl").value.trim(),no=$("no").value.trim(),nm=$("nm").value.trim();
  if(!/^\d{1,2}$/.test(gr)||!/^\d{1,2}$/.test(cl)||!/^\d{1,2}$/.test(no)){$("nmHint").textContent="학년, 반, 번호를 숫자로 적어 주세요.";return}
  if(!nm){$("nmHint").textContent="이름을 적어 주세요.";return}
  S.grade=gr;S.cls=cl;S.no=no;S.name=nm;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(err){}
  $("start").remove();$("game").hidden=false;startMission("main");
});
if($("testStart"))$("testStart").onclick=()=>{S.grade="5";S.cls="1";S.no="0";S.name="미리보기";TEST=true;document.body.classList.add("testing");
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(err){}
  $("start").remove();$("game").hidden=false;startMission("main")};
window.__S=S;window.__M=M;window.__drawCert=()=>drawCert();window.__setTest=v=>{TEST=v};
})();
