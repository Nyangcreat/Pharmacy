<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>우리 반 일일 약사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column. Start -> read the five medicine boxes -> five situations.
   Each situation = choose the medicine, then fill a 내복약 pouch worksheet by moving cards from a scrolling 보기 예시 tray. */
:root{
  --bg:#FFF6E3; --surface:#FFFFFF; --ink:#3F3A36; --muted:#6F665D; --line:#EFE0BD;
  --accent:#D9472C; --on-accent:#FFFFFF; --accent-soft:#FFE7DE; --pill:#E9604A;
  --mint:#DDF0E4; --mint2:#CBE8D6; --green:#3E9E78; --dots:#6BBF9B;
  --ok:#1F7A4A; --ok-bg:#E2F4EA; --bad:#B23A28; --bad-bg:#FDE7E2; --gold:#E9B949;
  --font-d:'Jua','Noto Sans KR',system-ui,sans-serif;
  --font-b:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1915; --surface:#2A2520; --ink:#F4ECDF; --muted:#BDB1A2; --line:#463D32;
    --accent:#FF8466; --on-accent:#2B1007; --accent-soft:#40261D; --pill:#E9604A;
    --mint:#223B2F; --mint2:#2B4A3B; --green:#6FD0A5; --dots:#4E8E73;
    --ok:#7BDDA5; --ok-bg:#1F3829; --bad:#FFA392; --bad-bg:#47241E; --gold:#E9B949;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1915; --surface:#2A2520; --ink:#F4ECDF; --muted:#BDB1A2; --line:#463D32;
  --accent:#FF8466; --on-accent:#2B1007; --accent-soft:#40261D; --pill:#E9604A;
  --mint:#223B2F; --mint2:#2B4A3B; --green:#6FD0A5; --dots:#4E8E73;
  --ok:#7BDDA5; --ok-bg:#1F3829; --bad:#FFA392; --bad-bg:#47241E; --gold:#E9B949;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;min-height:36px}
.brand{font-family:var(--font-d);font-size:20px;display:flex;align-items:center;gap:8px}
.brand svg{width:34px;height:20px;flex:none}
.chip{font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 12px}

.btn{font-family:var(--font-d);font-size:22px;background:var(--accent);color:var(--on-accent);border:0;border-radius:14px;padding:12px 26px;min-height:52px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}

/* start */
.hero{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:clamp(20px,5vw,44px);display:grid;gap:22px}
.hero h1{font-size:clamp(34px,8vw,54px);line-height:1.15;text-align:center}
.pouch .by{white-space:nowrap;letter-spacing:-.03em}
.pouch .by .who{font-weight:800}
.pouch .byl .by{font-size:1.1em}
.nm-note{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px;font-weight:500}
.mission{padding:0 2px;display:grid;gap:10px;justify-items:start}
.ms-tag{background:var(--pill);color:#fff;font-family:var(--font-d);font-size:18px;border-radius:99px;padding:3px 14px}
.mission p{margin:0;font-size:clamp(13px,3.5vw,18px);letter-spacing:-.03em;white-space:nowrap;line-height:1.75;color:var(--ink);word-break:keep-all}
.mission b{color:var(--pill)}
.start-body{display:grid;gap:20px;align-items:center}
.start-art{width:100%;max-width:300px;height:auto;justify-self:center;order:-1}
.three{display:grid;grid-template-columns:1fr 1fr 2.2fr;gap:8px}
.three>div{display:grid;gap:4px;min-width:0}
.three .txt{padding:12px 10px}
.mission{justify-items:center;text-align:center}
@media (max-width:560px){.start-art{max-width:170px}}
@media (min-width:720px){
  .start-body{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px}
  .start-art{order:0;max-width:360px}
  form.name{max-width:none}
  .mission p{font-size:clamp(17px,2.2vw,21px);white-space:normal}
}
.hero .lead{font-size:18px;color:var(--muted);max-width:34em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;background:var(--bg);border-radius:14px;padding:12px 14px;font-weight:500;display:flex;gap:10px;align-items:center}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--font-d);display:grid;place-items:center}
form.name{display:grid;gap:8px;max-width:420px}
label.lbl{font-weight:700}
input.txt{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.hint{color:var(--bad);font-size:14px;min-height:1.4em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phrow{display:flex;align-items:center;gap:8px}
.phrow .txt{width:9em}
.sfx{font-weight:700;font-size:18px}
.fine{display:block;font-size:12px;color:var(--muted);margin-top:4px}
form.name>div{display:grid;gap:4px}
.fin{margin:22px 0}
.fin h3{font-size:clamp(24px,5vw,32px);margin-bottom:4px}
.fin .tabs{flex-wrap:wrap;margin-bottom:10px}
.slot.fixed{cursor:default}
.fixtag{display:inline-block;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 8px;margin-left:4px}

/* leaflets */
.sec-title{font-size:clamp(24px,5vw,32px);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:16px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.box{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.box .band{background:var(--c);color:#fff;font-family:var(--font-d);font-size:20px;padding:9px 12px;line-height:1.25}
.box .meta{padding:8px 12px 10px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex:1}
.box .seen{font-weight:700;color:var(--ok)}
.box[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.leaflet{background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:6px 6px 18px 18px;padding:18px clamp(14px,3vw,24px) 20px;display:grid;gap:14px}
.leaflet header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.leaflet header h3{font-size:28px;color:var(--c)}
.leaflet header p{color:var(--muted);font-size:14px}
.leaflet h4{font-size:17px;margin-bottom:4px}
.leaflet ul{margin:0;padding-left:1.2em}
.leaflet li+li{margin-top:2px}
.leaflet .warn{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:34px 20px;text-align:center;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}
.count{font-weight:700}

/* quiz */
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.prog i{height:8px;border-radius:99px;background:var(--line)}
.prog i.done{background:var(--ok)}
.prog i.now{background:var(--accent)}
.scene{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,26px);margin-bottom:16px}
.tag{display:inline-block;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 12px;margin-bottom:8px}
.scene p.q{font-family:var(--font-d);font-size:clamp(22px,4.6vw,28px);line-height:1.4}
.ask{font-weight:700;margin:18px 0 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ch{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;min-height:64px;display:grid;align-content:center}
.ch b{font-size:17px}
.ch span{font-size:13px;color:var(--muted)}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch:disabled{cursor:default}
.ch.right{background:var(--ok-bg);border-color:var(--ok)}
.ch.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ch.dim{opacity:.55}
.fb{border-radius:14px;padding:12px 16px;margin-top:12px;font-size:15px}
.fb strong{font-family:var(--font-d);font-size:19px;font-weight:400;display:block}
.fb.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.fb.ok strong{color:var(--ok)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb.no strong{color:var(--bad)}
details.ref{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:16px}
details.ref summary{cursor:pointer;font-weight:700;padding:8px 0}
details.ref .boxes{margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
details.ref .box .band{font-size:16px;padding:6px 10px}
details.ref .box .meta{display:none}
details.ref .leaflet{margin-bottom:10px}

/* worksheet */
.work{margin-bottom:16px}
.work h3{font-size:clamp(22px,4.5vw,28px);margin-bottom:10px}
.how{border:2px solid var(--pill);border-radius:16px;padding:10px 16px;background:var(--surface);margin-bottom:14px;font-size:14px}
.how b{display:inline-block;background:var(--pill);color:#fff;border-radius:99px;padding:0 12px;font-family:var(--font-d);font-weight:400;font-size:15px;margin-bottom:4px}
.how ul{margin:0;padding-left:1.2em}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
@media (max-width:700px){.sheet{grid-template-columns:1fr}}
.pouch{background:var(--mint);border-radius:10px;padding:16px;display:grid;place-items:center;position:relative}
.pouch .frame{width:100%;max-width:340px;position:relative;padding:18px 16px 16px;display:grid;gap:12px;justify-items:center}
.pouch .frame::before,.pouch .frame::after{content:"";position:absolute;width:34px;height:34px;border:3px solid var(--green);opacity:.8}
.pouch .frame::before{left:0;top:0;border-right:0;border-bottom:0}
.pouch .frame::after{right:0;bottom:0;border-left:0;border-top:0}
.pouch svg.cross{width:64px;height:64px}
.pouch h4{font-size:24px;letter-spacing:.4em;padding-left:.4em;display:flex;gap:10px;align-items:center}
.pouch h4 i{font-style:normal;color:var(--green);font-size:14px;letter-spacing:0}
.pouch .inner{background:var(--mint2);width:100%;padding:16px 14px;border-radius:4px;display:grid;gap:12px;font-weight:500}
.pouch .ln{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--green);padding-bottom:2px}
.pouch .ln b{flex:1;font-weight:700;overflow-wrap:anywhere}
.pouch .ln.r{justify-content:flex-end;border:0}
.pouch .blank{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--green);text-align:center}
.pouch .ln.c{justify-content:center}
.pouch .ln b.gc{flex:none}
.pouch .ln b.nm{text-align:center}
.pouch button.blank{font:inherit;font-weight:700;background:#FFFFFF;border:2px dashed var(--green);border-radius:8px;color:#3F3A36;cursor:pointer;padding:2px 10px;min-width:3.2em;min-height:34px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.pouch button.blank:hover:not(:disabled){border-color:var(--accent)}
.pouch button.blank.ok{border-color:var(--ok);background:var(--ok-bg)}
.pouch button.blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.pouch .blank.ok{color:var(--ok);font-weight:700}
.pouch .blank.bad{color:var(--bad);font-weight:700;text-decoration:line-through}
.pouch .ln.c b{flex:none;text-align:center}
.fields{background:var(--mint);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.fld .lab{display:inline-block;background:var(--pill);color:#fff;border-radius:99px;padding:1px 16px;font-size:14px;font-weight:700}
.slot{display:block;width:100%;text-align:left;margin-top:6px;border:0;border-bottom:2px dotted var(--dots);background:transparent;padding:6px 4px;min-height:44px;cursor:default;font-size:15px;line-height:1.45;border-radius:6px}
.slot.empty{color:var(--muted);font-size:14px}
.slot.drop{background:var(--accent-soft)}
.slot.filled{cursor:pointer;background:var(--surface);border:2px solid var(--line);padding:6px 10px}
.slot.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.slot.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.ans{font-size:13px;color:var(--ok);font-weight:700;margin:4px 0 0 4px}
.ans small{color:var(--muted);font-weight:400}

/* bank (scrolling choices tray) */
.bank{position:sticky;bottom:0;z-index:5;background:var(--surface);border:2px solid var(--line);border-radius:18px 18px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.10);margin-top:16px}
.bank h4{font-size:18px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.bank h4 small{font-family:var(--font-b);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:thin}
.tab{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:0 12px;font-size:13px;font-weight:700;min-height:30px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:#fff}
.list{max-height:min(34vh,260px);overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;padding:2px 2px 4px;overscroll-behavior:contain}
.opt{display:grid;gap:2px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:grab;font-size:14px;line-height:1.45;min-width:0}
.opt em{font-style:normal;font-size:11px;font-weight:700;color:var(--pill)}
.opt:hover{border-color:var(--pill)}
.opt.dragging{opacity:.4}
.nolist{color:var(--muted);padding:12px;text-align:center;grid-column:1/-1}
.tip{font-size:13px;color:var(--bad);min-height:1.3em}

/* result */
.card{background:var(--surface);border:3px solid var(--gold);border-radius:26px;padding:clamp(20px,5vw,40px);text-align:center;display:grid;gap:8px;justify-items:center}
.card .who{font-weight:700;color:var(--muted)}
.card h2{font-size:clamp(30px,7vw,46px);line-height:1.2;color:var(--accent)}
.card .score{font-family:var(--font-d);font-size:clamp(46px,12vw,72px);line-height:1}
.card .score small{font-size:.4em;color:var(--muted)}
.card .msg{max-width:30em;color:var(--muted)}
.recap{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.recap li{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.recap .nm{flex:1;min-width:8em;font-weight:500}
.mark{font-size:13px;font-weight:700;border-radius:99px;padding:1px 10px}
.mark.y{background:var(--ok-bg);color:var(--ok)}
.mark.n{background:var(--bad-bg);color:var(--bad)}
textarea.share{width:100%;min-height:150px;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
.ok-msg{color:var(--ok);font-weight:700}
.foot{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .scene,.leaflet,.card,.fb{animation:rise .25s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}

.lf{background:#F3F1EA;color:#2B2926;border:2px solid #CFC9BA;border-top:8px solid var(--c);border-radius:4px;padding:14px clamp(12px,3vw,20px) 16px;font-size:14px;line-height:1.5}
.lf header{border-bottom:3px double #8A8577;padding-bottom:6px;margin-bottom:10px}
.lf h3{font-size:clamp(22px,5vw,28px);color:#2B2926}
.lf header p{font-size:13px;color:#5C5850}
.lfg{columns:2 280px;column-gap:20px}
.lf section{break-inside:avoid;margin-bottom:10px}
.lf h4{font-family:var(--font-b);font-weight:700;font-size:14px;color:var(--c);border-bottom:1px solid #CFC9BA;margin:0 0 3px}
.lf ol{margin:0;padding-left:1.3em}
.lf table{border-collapse:collapse;width:100%;font-size:13px}
.lf th,.lf td{border:1px solid #B9B3A3;padding:3px 6px;text-align:left;vertical-align:top}
.lf th{background:#E4E0D3;width:64%;font-weight:700;letter-spacing:-.02em}
.lf .wn{background:#FFF3B8;padding:4px 8px;border-radius:4px}
.scene p.me{font-size:14px;color:var(--muted);margin:0 0 6px}
.ch b .sb{font-weight:400;margin-left:6px}
.ch mark.yl{background:#FFE35C;color:#3F3A36;padding:0 5px;border-radius:4px;font-weight:700}
.p3{display:grid;gap:6px}
.p3b{font:inherit;font-size:15px;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;line-height:1.45}
.p3b:hover{border-color:var(--accent)}
.p3b.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.ddb{font:inherit;font-size:15px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);color:var(--muted);border:2px dashed var(--green);border-radius:12px;padding:10px 12px;cursor:pointer;line-height:1.45}
.ddb.has{color:var(--ink);border-style:solid;font-weight:700}
.ddb.open{border-color:var(--accent)}
.ddb i{font-style:normal;flex:none}
.p3{margin-top:6px}
details.ref .lf{margin-bottom:10px}
.how-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.how-h b{flex:none;margin-bottom:0!important}
.how-h span{font-weight:700;font-size:clamp(12px,3.6vw,15px);white-space:nowrap;letter-spacing:-.02em}
details.fold{margin:0 0 14px;background:#F3F1EA;border:2px solid #CFC9BA;border-radius:10px;box-shadow:0 3px 0 #DDD7C8, 0 6px 0 #E8E3D6}
details.fold summary{list-style:none;cursor:pointer;position:relative;display:flex;justify-content:center;align-items:center;padding:12px 96px;min-height:48px;font-weight:700;font-size:17px;color:#2B2926;text-align:center}
details.fold summary em{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary em{font-style:normal;font-size:13px;color:#fff;background:var(--pill);border-radius:99px;padding:2px 10px;flex:none}
details.fold[open] summary{border-bottom:2px dashed #CFC9BA}
details.fold .lf{border:0;border-radius:0 0 8px 8px;margin:0}
.spread-wrap{width:100%;max-width:100%;overflow:hidden;margin-top:10px}
.spread{width:640px;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;transform-origin:0 0;box-shadow:0 6px 18px rgba(60,40,20,.10)}
.spread .pg{display:grid;gap:12px;align-content:start;min-width:0}
.spread .pg.l{padding-right:12px;border-right:2px dashed var(--line)}
.spread .pg.r{padding-left:12px}
.spread .sp-info{border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.6}
.spread .pouch{padding:10px}
.spread .fields{height:100%}
.ox-tip{font-size:13px;color:var(--muted);margin:6px 0 4px}
.oxl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.oxl li{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:14px;line-height:1.45}
.oxl li>span:first-child{flex:1;min-width:0}
.oxl li.bad{border-color:var(--bad);background:var(--bad-bg)}
.oxb{display:flex;gap:4px;flex:none}
.oxl li.tmp{flex-wrap:wrap;padding:8px 10px}
.oxl li.tmp>span:first-child{flex:1 1 100%;font-weight:700;text-align:center}
.tpb{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1 1 100%}
.tpb button{font:inherit;font-size:12px;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 7px;cursor:pointer;letter-spacing:-.03em;white-space:nowrap}
.tpb button.on{background:#2F7DD6;border-color:#2F7DD6;color:#fff}
.oxb button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-family:var(--font-d);font-size:19px;cursor:pointer;color:var(--muted)}
.oxb button.o.on{background:#2F7DD6;border-color:#2F7DD6;color:#fff}
.oxb button.x.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.p3b.nw,.ddb .nw{white-space:nowrap;font-size:min(15px,3.4vw);letter-spacing:-.04em}
.sv-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.sv-row .btn{flex:1 1 180px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.btn.up{background:#4A7FD8;color:#fff}
.btn.up:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
.sv-msg{text-align:center;font-weight:700;color:var(--accent);margin:8px 0 0;min-height:1em}
.sv-tip{text-align:center;font-size:14px;color:var(--muted);margin:8px 0 0}
.sv-modal{position:fixed;inset:0;z-index:50;background:rgba(30,28,25,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.sv-box{background:var(--surface);border-radius:18px;padding:16px;max-width:680px;width:100%;display:grid;gap:12px}
.sv-box img{width:100%;height:auto;border:2px solid var(--line);border-radius:10px;-webkit-touch-callout:default;user-select:auto}
.sv-h{text-align:center;font-size:16px;margin:0}
.guide{margin:-2px 0 14px;text-align:center;font-weight:700;font-size:clamp(14px,4.2vw,19px);line-height:1.45;white-space:nowrap;letter-spacing:-.02em;color:var(--ink)}
.clip{display:block;width:100%;max-width:440px;margin:0 auto 14px;border-radius:18px;background:#F4F4F2;aspect-ratio:480/516;object-fit:cover}
.result{margin-bottom:16px}
.rs-h{font-size:clamp(22px,4.5vw,28px);margin-bottom:10px;text-align:center}
.lf p,.lf td,.lf li,.p3b,.ddb span,.slot,.ans{white-space:pre-line}
.lf p.dn{margin:0 0 6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lf{background:#E9E6DC}}
:root[data-theme="dark"] .lf{background:#E9E6DC}

/* ---------- quiz ---------- */
function buildChips(medId, age){
  const m = med(medId);
  const others = MEDS.filter(x=>x.id!==medId);
  const effOthers = others.filter(x=>!( (medId==='tylenol'&&x.id==='ibu') || (medId==='ibu'&&x.id==='tylenol') ));
  const chips = [];
  const add = (cat, text, ok, n) => chips.push({id:`${cat}${n}`, cat, text, ok});
  add('ing', m.ing, true, 0);
  shuffle(others).slice(0,3).forEach((x,k)=>add('ing', x.ing, false, k+1));
  add('effect', m.use, true, 0);
  shuffle(effOthers).slice(0,3).forEach((x,k)=>add('effect', x.use, false, k+1));
  const cur = rowFor(m, age); add('dose', cur[1], true, 0);
  if(m.rows.length>3){ const ci=m.rows.indexOf(cur); [ci-1,ci+1,ci-2,ci+2,ci-3,ci+3].filter(j=>j>=0&&j<m.rows.length).slice(0,3).forEach((j,k)=>add('dose', m.rows[j][1], false, k+1)); }
  else { const amt=t=>(t.match(/[\d.]+mL/)||[''])[0]; const pool=m.rows.filter(r=>r!==cur&&amt(r[1])!==amt(cur[1])).map(r=>r[1]).concat(m.extraDose||[]); pool.slice(0,3).forEach((t,k)=>add('dose', t, false, k+1)); }
  add('store', m.store, true, 0);
  m.storeWrong.forEach((t,k)=>add('store', t, false, k+1));
  add('expiry', m.expiry, true, 0);
  { const tail = m.expiry.includes('\n') ? '\n'+m.expiry.split('\n').slice(1).join('\n') : '';
    others.forEach((x,k)=>add('expiry', x.expiry.split('\n')[0]+tail, false, k+1)); }
  add('side', m.side, true, 0);
  WRONG.side.forEach((t,k)=>add('side', t, false, k+1));
  return shuffle(chips);
}
function startSit(){
  S.ox = {}; S.oxBad = new Set(); S.oxOrder = null; S.temp = null; S.tempBad = false;
  S.score = 10; S.fixes = 0;
  S.open = null; S.page = 1; S.times = null; S.tried = new Set(); S.viewId = null; S.firstTry = null; S.pickId = null; S.phase = 'pick'; S.slots = {}; S.filter = 'all'; S.tip = '';
  S.chips = buildChips(SITS[S.i].right, SITS[S.i].age);
  S.opts = {}; CATS.forEach(c=>{ const good=S.chips.filter(x=>x.cat===c.k&&x.ok); const bad=shuffle(S.chips.filter(x=>x.cat===c.k&&!x.ok)).slice(0,3); S.opts[c.k]=shuffle(good.concat(bad)); });
  { const t0=timesOf(med(SITS[S.i].right),SITS[S.i].age); S.tOpts=[t0[0]].concat(shuffle([1,2,3,4,5].filter(n=>n<t0[0]||n>t0[1])).slice(0,3)).sort((a,b)=>a-b); }
}

function paintPick(){
  const sit = SITS[S.i];
  const picked = S.pickId!==null;
  const pickOk = picked && S.pickId===sit.right;
  const choices = MEDS.map(c=>{
    let cls='ch';
    if(picked){ if(c.id===sit.right) cls+=' right'; else if(c.id===S.pickId) cls+=' wrong'; else cls+=' dim'; }
    else if(S.tried && S.tried.has(c.id)) cls+=' wrong';
    return `<button type="button" class="${cls}" data-pick="${c.id}" ${picked?'disabled':''}><b>${c.p2name||c.name}${(!c.p2name&&c.sub)?`<span class="sb">${c.sub}</span>`:''}</b><span><mark class="yl">효능·효과</mark>: ${c.easy||c.use}</span></button>`;
  }).join('');
  let fb='';
  if(!picked && S.viewId){ fb = `<div class="fb no" role="status"><strong>아쉬워요. 이 약은 지금 상황과 맞지 않아요. -1점</strong>${(sit.wrong&&sit.wrong[S.viewId])?sit.wrong[S.viewId]+' ':''}효능·효과를 다시 읽고 골라 보세요.</div>`; }
  if(picked){
    if(pickOk){
      fb = `<div class="fb ok" role="status"><strong>정답이에요!</strong>${sit.why}</div>`;
    } else {
      const m = med(S.pickId);
      const wr = (sit.wrong && sit.wrong[S.pickId]) || `${m.name}은(는) ${m.use} 이 상황의 증상과는 맞지 않아요.`;
      fb = `<div class="fb no" role="status"><strong>아쉬워요. 정답은 "${med(sit.right).name}"이에요.</strong>${wr} ${sit.why}</div>`;
    }
  }
  document.getElementById('pickArea').innerHTML =
    `<p class="ask">${picked?'고른 약 상자':'약품보관장'}</p><div class="choices">${choices}</div>${fb}${picked ? `<div class="bar"><span></span><button class="btn" id="goFill" type="button">복약지도서 작성하기</button></div>` : ''}`;
  const w = document.getElementById('work');
  w.hidden = !(picked && S.page===2) || S.phase==='result';
  document.getElementById('result').hidden = S.phase!=='result';
  document.getElementById('bank').hidden = true;
  document.getElementById('scene').hidden = S.page===2;
  const ref = document.getElementById('ref');
  ref.hidden = true;
  setTitle(S.page===2 ? 'Step2. 복약지도서 작성하기' : 'Step1. 알맞은 약 고르기');
}

function paintWork(){
  const w = document.getElementById('work');
  if(S.pickId===null){ return; }
  const checked = S.phase==='checked';
  const fields = CATS.map(c=>{
    const id = S.slots[c.k];
    const chip = id ? chipById(id) : null;
    let cls = 'slot', body = '';
    if(chip){
      cls += ' filled'; body = chip.text;
      if(checked) cls += chip.ok ? ' ok' : ' bad';
    } else { cls += ' empty'; body = '보기 예시에서 골라 옮겨요'; }
    let ans = '';
    if(checked && (!chip || !chip.ok)){
      const correct = S.chips.find(x=>x.cat===c.k && x.ok);
      ans = `<p class="ans">정답: ${correct.text}</p>`;
    }
    if(!checked && c.k==='store'){
      const m = med(S.pickId);
      const row = i => { const v=S.ox[i]; return `<li class="${S.oxBad.has(i)?'bad':''}"><span>${m.storeOX[i][0]}</span><span class="oxb"><button type="button" class="o${v===true?' on':''}" data-ox="${i}" data-v="1" aria-pressed="${v===true}">O</button><button type="button" class="x${v===false?' on':''}" data-ox="${i}" data-v="0" aria-pressed="${v===false}">X</button></span></li>`; };
      const temp = m.storeTemp ? `<li class="tmp${S.tempBad?' bad':''}"><span>보관 온도</span><span class="tpb">${TEMPS.map(t=>`<button type="button" class="${S.temp===t.k?'on':''}" data-temp="${t.k}" aria-pressed="${S.temp===t.k}">${t.label}</button>`).join('')}</span></li>` : '';
      const rows = m.storeOX.map((_,i)=>row(i));
      if(temp) rows.splice(1,0,temp);
      return `<div class="fld"><span class="lab">${c.label}</span><p class="ox-tip">${m.storeTemp?'설명서와 맞으면 O, 다르면 X를 누르고 보관 온도를 골라요.':'설명서와 맞으면 O, 다르면 X를 눌러요.'}</p><ul class="oxl">${rows.join('')}</ul></div>`;
    }
    if(!checked){ const cur = S.slots[c.k] ? chipById(S.slots[c.k]) : null, open = S.open===c.k; return `<div class="fld"><span class="lab">${c.label}</span><button type="button" class="ddb${cur?' has':''}${open?' open':''}" data-dd="${c.k}" aria-expanded="${open}"><span${cur&&cur.text.length>20?' class="nw"':''}>${cur?cur.text:'눌러서 고르기'}</span><i aria-hidden="true">▾</i></button>${open?`<div class="p3" role="listbox">${(S.opts[c.k]||[]).map(o=>`<button type="button" class="p3b${o.text.length>20?' nw':''}${S.slots[c.k]===o.id?' on':''}" role="option" data-chip="${o.id}" aria-selected="${S.slots[c.k]===o.id}">${o.text}</button>`).join('')}</div>`:''}</div>`; }
    return `<div class="fld"><span class="lab">${c.label}</span>
      <button type="button" class="${cls}" data-slot="${c.k}" ${chip && !checked ? `data-unplace="${c.k}" title="누르면 보기 예시로 돌아가요"`:''} ${checked?'disabled':''}>${body}</button>${ans}${c.k==='dose'?timesNote():''}</div>`;
  }).join('');
  w.innerHTML = `
    <div class="how">
      <p style="margin:0;font-size:16px;line-height:1.7">환자정보: <strong>만 ${SITS[S.i].age}세 / ${SITS[S.i].sex}${SITS[S.i].weight?` / ${SITS[S.i].weight}kg`:''}</strong><br>증상: <strong>${SITS[S.i].sum}</strong></p></div>
    <p class="guide">약 설명서를 읽고 아래 약봉투를 완성해보세요</p>
    <details class="fold" id="fold" ${S.lfOpen?'open':''}>
      <summary><span>약 사용설명서</span><em>${S.lfOpen?'접기':'눌러서 펼치기'}</em></summary>
      ${leaflet(med(S.pickId))}
    </details>
    <div class="sheet">
      ${pouchHTML()}
      <div class="fields">${fields}</div>
    </div>
    <p class="tip" id="tip" role="status">${S.tip||''}</p>
    <div class="bar" id="checkBar"></div>`;
  const fd = document.getElementById('fold');
  if(fd) fd.addEventListener('toggle', ()=>{ S.lfOpen = fd.open; fd.querySelector('em').textContent = fd.open?'접기':'눌러서 펼치기'; });
  paintCheck();
}
function oxDone(){ const m = med(S.pickId); return m && m.storeOX.every((_,i)=>S.ox[i]!==undefined) && (!m.storeTemp || S.temp); }
function oxRight(){ const m = med(S.pickId); return m.storeOX.every((r,i)=>S.ox[i]===r[1]); }
function filledCount(){ return CATS.filter(c=>c.k==='store'?oxDone():S.slots[c.k]).length; }
function paintCheck(){
  const bar = document.getElementById('checkBar'); if(!bar) return;
  if(S.phase==='fill'){
    const n = filledCount();
    bar.innerHTML = `<span class="count">채운 칸 ${n} / ${CATS.length}</span><button class="btn" type="button" id="check" ${(n<CATS.length||S.times==null)?'disabled':''}>제공하기</button>`;
  } else if(S.phase==='checked'){
    const r = S.res[S.i];
    bar.innerHTML = `<span class="count">복약지도서 ${r.fill} / ${CATS.length}칸 정답</span>`;
  } else { bar.innerHTML=''; }
}

function paintBank(){ return;
  const el = document.getElementById('bank'); if(!el) return;
  const prevScroll = (document.getElementById('list')||{}).scrollTop || 0;
  const used = new Set(Object.values(S.slots));
  const items = S.chips.filter(c=>!used.has(c.id) && (S.filter==='all' || c.cat===S.filter));
  const tabs = [{k:'all',label:'전체'}].concat(CATS).map(t=>`<button type="button" class="tab" data-filter="${t.k}" aria-pressed="${S.filter===t.k}">${t.label}</button>`).join('');
  const lab = k => CATS.find(c=>c.k===k).label;
  el.innerHTML = `
    <h4>보기 예시 <small>스크롤해서 찾아 빈칸으로 옮겨요 (누르거나 끌어다 놓기)</small></h4>
    <div class="tabs">${tabs}</div>
    <div class="list" id="list">${items.length?items.map(c=>`<button type="button" class="opt" draggable="true" data-chip="${c.id}"><em>${lab(c.cat)}</em><span>${c.text}</span></button>`).join(''):'<p class="nolist">이 칸의 보기가 모두 옮겨졌어요.</p>'}</div>`;
  document.getElementById('list').scrollTop = prevScroll;
}

function paintNav(){
  const nav = document.getElementById('navArea'); if(!nav) return;
  if(S.phase==='checked'){
    nav.innerHTML = `<div class="bar"><span></span><button class="btn" id="next" type="button">${S.i===SITS.length-1?'결과 보기':'다음 상황'}</button></div>`;
  } else nav.innerHTML='';
}

function place(chipId){
  if(S.phase!=='fill') return;
  const c = chipById(chipId); if(!c) return;
  S.slots[c.cat] = c.id; S.open = null; S.tip = '';
  paintWork(); paintBank();
}
function deliver(){
  const sit = SITS[S.i], t = timesOf(med(sit.right), sit.age);
  const m0 = med(sit.right); S.oxBad = new Set(m0.storeOX.map((r,i)=>i).filter(i=>S.ox[i]!==m0.storeOX[i][1])); S.tempBad = !!m0.storeTemp && S.temp!==m0.storeTemp;
  const ok = CATS.every(c=>{ if(c.k==='store') return S.oxBad.size===0 && !S.tempBad; const ch = chipById(S.slots[c.k]); return ch && ch.ok; }) && S.times!=null && S.times>=t[0] && S.times<=t[1];
  if(!ok){ lose(); S.fixes++; }
  S.phase = 'result'; S.lastOk = ok; S.open = null;
  const v = VIDS[sit.vid];
  document.getElementById('result').innerHTML = ok
    ? `<h3 class="rs-h">약을 건네요</h3><img class="clip" id="rv" src="${v.ok}" alt="약사가 약을 건네고 손님이 만족하는 장면">
       <div class="fb ok" role="status"><strong>손님이 만족했어요!</strong>복약지도서를 정확하게 완성했어요.</div>
       <div class="bar"><span></span><button class="btn" id="seeDone" type="button">완성된 복약지도서 보기</button></div>`
    : `<h3 class="rs-h">약을 건네요</h3><img class="clip" id="rv" src="${v.bad}" alt="손님이 이상하다며 다시 설명해 달라고 하는 장면">
       <div class="fb no" role="status"><strong>손님: "뭔가 이상해요. 다시 설명해 주세요." -1점</strong>복약지도서에 설명서와 다른 칸이 있어요. 설명서를 다시 읽고 고쳐 보세요.${(S.oxBad.size||S.tempBad)?' 보관 방법에서 빨갛게 표시된 줄을 다시 확인해요.':''}</div>
       <div class="bar"><span></span><button class="btn" id="refix" type="button">복약지도서 다시 확인하기</button></div>`;
  paintPick(); toTop();
}

/* ---------- result ---------- */
function rank(){ const p = total()/MAXPT; return TITLES.find(t=>p>=t.min); }
function viewResult(){
  setTitle('약 사용설명서 탐구하기');
  toTop(); $chip.hidden = true;
  const sit = SITS[S.i], s = S.score, r = rank();
  S.doneList.push({name:sit.name, med:med(sit.right).name, score:s});
  const left = SITS.length - S.doneList.length;
  const share = `[우리 반 일일 약사]\n${whoName()} 약사 (${pharmName()})\n${S.doneList.map(d=>`${d.name} · ${d.med} · ${d.score}/10점`).join('\n')}`;
  $app.innerHTML = `
    <section class="fin">
      <h3>완성된 복약지도서</h3>
      <div id="finSheet"></div>
      <div class="sv-row">
        <button class="btn" id="saveImg" type="button">💾 저장하기</button>
        ${BOARD_URL?`<a class="btn up" id="upBoard" href="${BOARD_URL}" target="_blank" rel="noopener">🔔 띵커벨 보드에 올리기</a>`:`<button class="btn up" id="upBoard" type="button" disabled>🔔 띵커벨 보드에 올리기</button>`}
      </div>
      <p class="sv-msg" id="svmsg" role="status"></p>
      <p class="sv-tip">저장하기로 사진을 앨범에 저장한 뒤, 띵커벨 보드에서 그 사진을 올려요.</p>
    </section>
    <div class="row">
      ${left>0?`<button class="btn ghost" id="more" type="button">다른 상황도 해 보기 (선택)</button>`:''}
      <span class="ok-msg" id="cmsg" role="status"></span>
    </div>
    ${left>0?'':'<p class="sub" style="margin-top:12px">모든 상황을 해결했어요!</p>'}`;
  S.fin = S.i; paintFin();
  document.getElementById('saveImg').addEventListener('click', saveImage); getDl();
  const more = document.getElementById('more');
  if(more) more.addEventListener('click', ()=>{ S.i++; startSit(); viewQuiz(true); });
}


/* ---------- 저장하기 (image) ---------- */
const BOARD_URL = 'https://b.tkbell.co.kr/tkboard/woi/1345520/82E25xF841.do?pageSeq=2703342';
let h2iP = null;
function loadH2I(){
  if(window.htmlToImage) return Promise.resolve();
  return h2iP ||= new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='lib/h2i.js'; sc.onload=ok; sc.onerror=()=>{h2iP=null;no(new Error('load'))}; document.head.appendChild(sc); });
}
async function spreadPng(){
  await loadH2I();
  const sp=document.getElementById('spread');
  const o={pixelRatio:2, backgroundColor:'#FFFFFF', skipFonts:true, width:sp.offsetWidth, height:sp.offsetHeight, style:{transform:'none',margin:'0'}};
  await htmlToImage.toPng(sp,o);           // first pass warms Safari
  return htmlToImage.toPng(sp,o);
}
function dataBlob(url){
  const [h,b64]=url.split(','), bin=atob(b64), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:(h.match(/data:([^;]+)/)||[])[1]||'image/png'});
}
let dlApi;
function getDl(){ return dlApi ||= (window.claude&&claude.use ? claude.use('downloads').catch(()=>null) : Promise.resolve(null)); }
const DL_MSG={declined:'저장을 취소했어요.',rate_limited:'잠시 뒤에 다시 눌러 주세요.'};
async function saveImage(e){
  const b=e.currentTarget, t=b.textContent; b.disabled=true; b.textContent='만드는 중…'; svMsg('');
  try{
    const url=await spreadPng(), blob=dataBlob(url);
    const name=`복약지도서_${whoName().replace(/\s/g,'')}.png`;
    const api=await getDl();
    if(api){
      b.textContent='저장 창을 확인하세요';
      try{ await api.save({filename:name, data:blob}); svMsg('저장했어요! 띵커벨 보드에 올려 보세요.'); }
      catch(err){ const c=err&&err.code; svMsg(DL_MSG[c]||`저장하지 못했어요 (${c||'오류'}). 화면을 캡처해서 저장해 주세요.`); }
    } else {
      let done=false;
      try{ const file=new File([blob],name,{type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); done=true; } }
      catch(err){ if(err && err.name==='AbortError') done=true; }
      if(!done) showSaved(url);
    }
  }catch(err){ svMsg('그림을 만들지 못했어요. 화면을 캡처해서 저장해 주세요.'); }
  b.disabled=false; b.textContent=t;
}
function showSaved(url){
  const d=document.createElement('div'); d.className='sv-modal'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','저장할 복약지도서');
  d.innerHTML=`<div class="sv-box"><p class="sv-h">사진을 <b>길게 눌러</b> 저장해요</p>
    <img src="${url}" alt="완성된 복약지도서">
    <div class="sv-row"><button class="btn" type="button" data-x>닫기</button></div></div>`;
  d.addEventListener('click',ev=>{ if(ev.target===d || ev.target.closest('[data-x]')) d.remove(); });
  document.body.appendChild(d);
}
function svMsg(m){ const el=document.getElementById('svmsg'); if(el) el.textContent=m; }
function alertBox(msg){ const m=document.getElementById('cmsg'); if(m) m.textContent=msg; }

/* finished 복약지도서 for situation k: shows the right answers, tags the cells the student had to correct */
function fitSpread(){
  const w = document.getElementById('spWrap'), sp = document.getElementById('spread'); if(!w||!sp) return;
  const sc = Math.min(1, w.clientWidth / sp.offsetWidth);
  sp.style.transform = `scale(${sc})`; w.style.height = Math.ceil(sp.offsetHeight*sc)+'px';
}
window.addEventListener('resize', fitSpread);
function paintFin(){
  const k = S.fin, m = med(SITS[k].right), r = S.res[k];
  const val = {ing:m.ing, effect:m.use, dose:rowFor(m,SITS[k].age)[1], store:m.store, expiry:m.expiry, side:m.side};
  const fields = CATS.map(c=>{
    const fixed = false;
    return `<div class="fld"><span class="lab">${c.label}</span>
      <div class="slot filled fixed">${esc(val[c.k])}${fixed?' <span class="fixtag">고쳤어요</span>':''}</div></div>`;
  }).join('');
  const st = SITS[k];
  document.getElementById('finSheet').innerHTML = `<div class="spread-wrap" id="spWrap"><div class="spread" id="spread">
    <div class="pg l">
      <div class="sp-info">환자정보: <strong>만 ${st.age}세 / ${st.sex}${st.weight?` / ${st.weight}kg`:''}</strong><br>증상: <strong>${st.sum}</strong></div>
      ${pouchHTML(k)}
    </div>
    <div class="pg r"><div class="fields">${fields}</div></div>
  </div></div>`;
  fitSpread();
}

/* ---------- events ---------- */
$app.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.med){
    const id=b.dataset.med, ref=document.getElementById('ref');
    if(ref && ref.contains(b)){
      S.refSel = id;
      document.getElementById('refBx').innerHTML = boxes(S.refSel,false);
      document.getElementById('refLf').innerHTML = leaflet(med(id));
    } else { S.sel = id; S.opened.add(id); paintExplore(); }
  } else if(b.dataset.pick){
    if(S.pickId!==null) return;
    const id = b.dataset.pick, ok = id===SITS[S.i].right;
    if(S.firstTry==null) S.firstTry = ok;
    if(ok){
      S.pickId = id; S.phase = 'fill'; S.viewId = id;
      paintPick(); paintWork(); paintBank();
    } else {
      if(!S.tried.has(id)) lose();
      S.tried.add(id); S.viewId = id; paintPick();
    }
  } else if(b.dataset.temp){
    if(S.phase!=='fill') return;
    S.temp = b.dataset.temp; S.tempBad = false; S.open = null; paintWork();
  } else if(b.dataset.ox!==undefined){
    if(S.phase!=='fill') return;
    const i = +b.dataset.ox; S.ox[i] = b.dataset.v==='1'; S.oxBad.delete(i); S.open = null; paintWork();
  } else if(b.dataset.chip){
    place(b.dataset.chip);
  } else if(b.dataset.unplace){
    if(S.phase!=='fill') return;
    delete S.slots[b.dataset.unplace]; S.tip=''; paintWork(); paintBank();
  } else if(b.dataset.filter){
    S.filter = b.dataset.filter; paintBank();
  } else if(b.dataset.fin){
    S.fin = +b.dataset.fin; paintFin();
  } else if(b.dataset.times){
    if(S.phase!=='fill') return;
    S.times = +b.dataset.times; S.open = null; paintWork();
  } else if(b.dataset.dd){
    if(S.phase!=='fill') return;
    S.open = S.open===b.dataset.dd ? null : b.dataset.dd; paintWork();
  } else if(b.dataset.tm){
    if(S.phase!=='fill') return;
    S.open = S.open==='times' ? null : 'times'; paintWork();
  } else if(b.id==='goFill'){
    S.page = 2; paintPick(); paintWork(); paintBank(); toTop();
  } else if(b.id==='check'){
    deliver();
  } else if(b.id==='refix'){
    S.phase = 'fill'; paintPick(); paintWork(); toTop();
  } else if(b.id==='seeDone'){
    viewResult();
  } else if(b.id==='next'){
    if(S.i===SITS.length-1){ viewResult(); } else { S.i++; startSit(); viewQuiz(true); }
  }
});

/* drag and drop (desktop) */
let dragId = null;
$app.addEventListener('dragstart', e=>{
  const o = e.target.closest && e.target.closest('.opt'); if(!o) return;
  dragId = o.dataset.chip; o.classList.add('dragging');
  try{ e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed='move'; }catch(err){}
});
$app.addEventListener('dragend', e=>{
  dragId = null;
  document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop'));
});
$app.addEventListener('dragover', e=>{
  const s = e.target.closest && e.target.closest('.slot'); if(!s || !dragId) return;
  e.preventDefault();
  document.querySelectorAll('.slot.drop').forEach(x=>x.classList.remove('drop'));
  s.classList.add('drop');
});
$app.addEventListener('drop', e=>{
  const s = e.target.closest && e.target.closest('.slot'); if(!s || !dragId) return;
  e.preventDefault();
  const c = chipById(dragId); dragId = null;
  if(!c) return;
  if(c.cat === s.dataset.slot){ place(c.id); }
  else {
    const lab = k => CATS.find(x=>x.k===k).label;
    S.tip = `이 카드는 "${lab(c.cat)}" 칸에 들어가요.`;
    paintWork();
  }
});

}
if(Date.now() >= CLOSE_AT) viewClosed(); else viewStart();
